name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: release-x86_64-pc-windows-msvc
      - name: Build release binary
        run: cargo build --package rubrica-app --release --locked --target x86_64-pc-windows-msvc
      - name: Prepare distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item -LiteralPath target/x86_64-pc-windows-msvc/release/rubrica-app.exe -Destination dist/
          Copy-Item -LiteralPath README.md, LICENSE-MIT, LICENSE-APACHE -Destination dist/
          $hash = (Get-FileHash -LiteralPath dist/rubrica-app.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  rubrica-app.exe" | Set-Content -LiteralPath dist/SHA256SUMS -Encoding ascii
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rubrica-windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 30
