# A tag named v* is a release: this builds the same binary build.yml does and
# publishes it as a GitHub release, so cutting a release is pushing a tag and
# nothing else. The notes list every commit since the previous tag.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The notes count the commits since the previous tag, which needs the
          # tags and the history behind them rather than one commit.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: release-x86_64-pc-windows-msvc
      - name: Check the tag names the workspace version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"$').Matches[0].Groups[1].Value
          if ($tag -ne "v$version") { throw "tag $tag does not match workspace version $version" }
      - name: Build release binary
        run: cargo build --package rubrica-app --release --locked --target x86_64-pc-windows-msvc
      # One archive, packed the same way every time: packaging/package.ps1 sorts the entries
      # and fixes their timestamps, so the same executable always produces the same bytes,
      # and -Verify unpacks it again and compares every file it put in.
      - name: Pack the release archive
        shell: pwsh
        run: |
          ./packaging/package.ps1 -Exe target/x86_64-pc-windows-msvc/release/rubrica-app.exe -SkipBuild -Verify
      # The winget and scoop manifests cannot name the archive's hash until the archive
      # exists, and a hash from a build made anywhere else is not this one. They are updated
      # and submitted by hand after the release is published: `winget install` and
      # `scoop install` are not part of cutting a tag.
      - name: Print the hash the manifests need
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"$').Matches[0].Groups[1].Value
          $zip = "dist/rubrica-v$version-win-x64.zip"
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "packaging/winget/Rubrica.Rubrica.installer.yaml  InstallerSha256: $hash"
          Write-Host "packaging/scoop/rubrica.json                     hash: $hash"
      - name: Write release notes
        shell: pwsh
        run: |
          $prev = git describe --tags --abbrev=0 "HEAD^" 2>$null
          if ($prev) {
            $header = "Changes since ${prev}:"
            $log = git log --reverse "$prev..HEAD" --pretty=format:'- %s'
          } else {
            $header = "Changes:"
            $log = git log --reverse -20 --pretty=format:'- %s'
          }
          @($header, "") + $log | Set-Content -LiteralPath release-notes.md -Encoding utf8NoBOM
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"$').Matches[0].Groups[1].Value
          $assets = @(
            'dist/rubrica-app.exe',
            "dist/rubrica-v$version-win-x64.zip",
            'dist/README.md',
            'dist/PRIVACY.md',
            'dist/LICENSE-MIT',
            'dist/LICENSE-APACHE',
            'dist/SHA256SUMS'
          )
          gh release create "${{ github.ref_name }}" --title "Rubrica ${{ github.ref_name }}" --notes-file release-notes.md @assets
