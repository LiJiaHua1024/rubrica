ShortDescription: A Markdown reader for Windows built around a typesetting engine rather than a browser.
Description: |-
  Rubrica sets a document the way a typesetter would: it solves each paragraph's line breaks as a
  whole, measures every formula from the font's own MATH table, and draws the result directly with
  Direct2D and DirectWrite. There is no webview, no Electron, no HTML or CSS anywhere in the
  pipeline. It reads Markdown, opens PDF, and exports what it draws.
